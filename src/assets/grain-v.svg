<!-- wood grain running across a board: the light and dark streaks the #grainV filter used to lay over it, tiling seamlessly -->
<svg xmlns="http://www.w3.org/2000/svg" width="300" height="1200" viewBox="0 0 300 1200">
  <filter id="g" filterUnits="userSpaceOnUse" x="0" y="0" width="300" height="1200" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.42 0.006" numOctaves="3" seed="9" stitchTiles="stitch" result="n" />
    <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.02  0 0 0 0 0.01  0 0 0 0 0  -2 0 0 0 1.12" result="dark" />
    <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.78  0 0 0 0 0.55  0 0 0 0 0.38  1.4 0 0 0 -0.8" result="light" />
    <feMerge>
      <feMergeNode in="light" />
      <feMergeNode in="dark" />
    </feMerge>
  </filter>
  <rect width="300" height="1200" filter="url(#g)" />
</svg>

<!-- wood grain running along a board: the light and dark streaks the #grainH filter used to lay over it, tiling seamlessly -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <filter id="g" filterUnits="userSpaceOnUse" x="0" y="0" width="1200" height="300" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.006 0.42" numOctaves="3" seed="4" stitchTiles="stitch" result="n" />
    <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.02  0 0 0 0 0.01  0 0 0 0 0  -2 0 0 0 1.12" result="dark" />
    <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.78  0 0 0 0 0.55  0 0 0 0 0.38  1.4 0 0 0 -0.78" result="light" />
    <feMerge>
      <feMergeNode in="light" />
      <feMergeNode in="dark" />
    </feMerge>
  </filter>
  <rect width="1200" height="300" filter="url(#g)" />
</svg>
